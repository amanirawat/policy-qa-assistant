[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyqa"
version = "0.1.0"
description = "Cybersecurity Policy Q&A Assistant: source-grounded answers from approved NIST and CISA guidance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amani Rawat" }]
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
policyqa = "policyqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
